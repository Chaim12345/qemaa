name: Android CI & Bundle QEMU Binaries

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Using pre-built QEMU system emulation binaries for Android
  # These are statically compiled QEMU system emulators
  QEMU_VERSION: "8.2.0"
  QEMU_BASE_URL: "https://github.com/krishpranav/qemu-android-binaries/releases/download"

jobs:
  build:
    name: Build & Bundle QEMU APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install QEMU Download Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils gzip curl

      - name: Download QEMU System Emulation Binaries for Android
        run: |
          mkdir -p qemu-downloads
          cd qemu-downloads
          echo "Downloading QEMU system emulation binaries for Android..."
          
          # Download pre-built QEMU system emulation binaries for Android
          # These are specifically compiled for Android with system emulation support
          # Try multiple sources for QEMU system emulation binaries
          # Source 1: krishpranav/qemu-android-binaries (Android-specific builds)
          if wget --no-verbose --timeout=30 --tries=2 "${QEMU_BASE_URL}/v${QEMU_VERSION}/qemu-system-x86_64-android" -O qemu-system-x86_64; then
            echo "✅ Successfully downloaded QEMU system x86_64 for Android"
            chmod +x qemu-system-x86_64
          # Source 2: Direct binary from same repo
          elif wget --no-verbose --timeout=30 --tries=2 "https://github.com/krishpranav/qemu-android-binaries/releases/download/v${QEMU_VERSION}/qemu-system-x86_64" -O qemu-system-x86_64; then
            echo "✅ Successfully downloaded QEMU system x86_64"
            chmod +x qemu-system-x86_64
          # Source 3: Try alternative architecture binaries
          elif wget --no-verbose --timeout=30 --tries=2 "https://github.com/krishpranav/qemu-android-binaries/releases/download/v${QEMU_VERSION}/qemu-aarch64" -O qemu-aarch64; then
            echo "✅ Downloaded QEMU AArch64 (will use for ARM VMs)"
            chmod +x qemu-aarch64
          else
            echo "⚠️ QEMU system binaries not available from primary sources, trying static builds..."
            
            # Source 4: Static user-mode QEMU (fallback - limited functionality)
            if wget --no-verbose --timeout=30 --tries=2 "https://github.com/ziglang/qemu-static/releases/download/${QEMU_VERSION}/qemu-linux-x86_64-${QEMU_VERSION}.tar.xz" -O qemu-static.tar.xz; then
              echo "✅ Downloaded QEMU static package"
              tar -xJf qemu-static.tar.xz
              if [ -f "bin/qemu-x86_64" ]; then
                cp bin/qemu-x86_64 qemu-system-x86_64 2>/dev/null || true
                chmod +x qemu-system-x86_64 2>/dev/null || true
                echo "⚠️ Using user-mode QEMU (limited system emulation support)"
              fi
            else
              echo "❌ Failed to download any QEMU binaries"
              echo "App will run in simulation mode only"
            fi
          fi
          
          # List downloaded files
          ls -la qemu-* 2>/dev/null || echo "No QEMU binaries found"
          
          # Verify download succeeded
          if [ -f "qemu-system-x86_64" ] && [ -s "qemu-system-x86_64" ]; then
            echo "✅ QEMU system x86_64 binary ready"
          elif [ -f "qemu-aarch64" ] && [ -s "qemu-aarch64" ]; then
            echo "✅ QEMU AArch64 binary ready (ARM VMs only)"
          else
            echo "⚠️ No QEMU system binaries downloaded, app will use simulation mode"
          fi

      - name: Extract QEMU Binaries
        run: |
          mkdir -p qemu-binaries
          
          # If we have a tarball from ziglang/qemu-static, extract it
          if [ -f "qemu-downloads/qemu-static.tar.xz" ]; then
            echo "Extracting QEMU static package..."
            cd qemu-downloads
            tar -xJf qemu-static.tar.xz -C ../qemu-binaries --strip-components=1 2>/dev/null || \
            echo "Failed to extract qemu-static.tar.xz"
            cd ..
          fi
          
          # Copy any direct binaries that were downloaded
          if [ -f "qemu-downloads/qemu-system-x86_64" ]; then
            mkdir -p qemu-binaries/bin
            cp qemu-downloads/qemu-system-x86_64 qemu-binaries/bin/
            chmod +x qemu-binaries/bin/qemu-system-x86_64
            echo "✅ Copied qemu-system-x86_64"
          fi
          
          if [ -f "qemu-downloads/qemu-aarch64" ]; then
            mkdir -p qemu-binaries/bin
            cp qemu-downloads/qemu-aarch64 qemu-binaries/bin/
            chmod +x qemu-binaries/bin/qemu-aarch64
            echo "✅ Copied qemu-aarch64"
          fi
          
          echo "Extracted binaries:"
          ls -la qemu-binaries/bin/ 2>/dev/null | head -20 || echo "qemu-binaries directory is empty"

      - name: Prepare QEMU Binaries for Assets
        run: |
          mkdir -p app/src/main/assets/qemu_binaries
          
          # Copy qemu-system-* binaries if available
          if [ -f "qemu-binaries/bin/qemu-system-x86_64" ]; then
            cp qemu-binaries/bin/qemu-system-x86_64 app/src/main/assets/qemu_binaries/ && \
              echo "✅ Copied qemu-system-x86_64" || echo "⚠️ Failed to copy qemu-system-x86_64"
          else
            echo "⚠️ qemu-system-x86_64 not found"
          fi
          
          if [ -f "qemu-binaries/bin/qemu-system-aarch64" ]; then
            cp qemu-binaries/bin/qemu-system-aarch64 app/src/main/assets/qemu_binaries/ && \
              echo "✅ Copied qemu-system-aarch64" || echo "⚠️ qemu-system-aarch64 not found"
          else
            echo "⚠️ qemu-system-aarch64 not found"
          fi
          
          if [ -f "qemu-binaries/bin/qemu-system-riscv64" ]; then
            cp qemu-binaries/bin/qemu-system-riscv64 app/src/main/assets/qemu_binaries/ && \
              echo "✅ Copied qemu-system-riscv64" || echo "⚠️ qemu-system-riscv64 not found"
          else
            echo "⚠️ qemu-system-riscv64 not found"
          fi
          
          if [ -f "qemu-binaries/bin/qemu-system-i386" ]; then
            cp qemu-binaries/bin/qemu-system-i386 app/src/main/assets/qemu_binaries/ && \
              echo "✅ Copied qemu-system-i386" || echo "⚠️ qemu-system-i386 not found"
          else
            echo "⚠️ qemu-system-i386 not found"
          fi
          
          # Also copy BIOS/firmware files from share/qemu if available
          if [ -d "qemu-binaries/share/qemu" ]; then
            mkdir -p app/src/main/assets/qemu_binaries/pc-bios
            cp qemu-binaries/share/qemu/*.bin app/src/main/assets/qemu_binaries/pc-bios/ 2>/dev/null || true
            cp qemu-binaries/share/qemu/*.rom app/src/main/assets/qemu_binaries/pc-bios/ 2>/dev/null || true
            cp qemu-binaries/share/qemu/*.img app/src/main/assets/qemu_binaries/pc-bios/ 2>/dev/null || true
            echo "✅ Copied PC-BIOS files"
          fi
          
          # Make all binaries executable
          chmod +x app/src/main/assets/qemu_binaries/qemu-system-* 2>/dev/null || true
          
          echo ""
          echo "Bundled QEMU binaries:"
          ls -lh app/src/main/assets/qemu_binaries/ || echo "No binaries bundled (will use simulation mode)"

      - name: Create QEMU Bundle Info File
        run: |
          if [ -d "app/src/main/assets/qemu_binaries" ] && [ "$(ls -A app/src/main/assets/qemu_binaries 2>/dev/null)" ]; then
            cat > app/src/main/assets/qemu_binaries/BUNDLE_INFO.txt << EOF
          QEMU Binaries Bundle
          Version: ${{ env.QEMU_VERSION }}
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Architectures: $(ls app/src/main/assets/qemu_binaries/qemu-system-* 2>/dev/null | xargs -n1 basename | tr '\n' ' ')
          
          These are statically-linked QEMU binaries for Android.
          They will be extracted to the app's internal storage on first run.
          EOF
            cat app/src/main/assets/qemu_binaries/BUNDLE_INFO.txt
          else
            echo "WARNING: No QEMU binaries were bundled. App will run in simulation mode only."
            cat > app/src/main/assets/qemu_binaries/BUNDLE_INFO.txt << EOF
          QEMU Binaries Bundle
          Status: NO BINARIES BUNDLED
          
          QEMU static binaries were not available during build.
          The app will operate in simulation mode only.
          
          To enable real QEMU mode:
          1. Install QEMU via Termux: pkg install qemu-system-x86_64
          2. Or manually place binaries in /data/data/com.aistudio.linuxvm.qemu/files/qemu/
          EOF
          fi

      - name: Prepare Secrets and Keystore
        run: |
          # Create .env from .env.example if missing (for Secrets Gradle Plugin)
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          # Decode debug keystore if base64 file is present
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # If debug.keystore still does not exist, generate one using keytool
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      - name: Build Release APK with Bundled QEMU
        run: ./gradlew assembleRelease --no-daemon --parallel --build-cache --stacktrace

      - name: Generate Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### QEMU Binaries Status" >> $GITHUB_STEP_SUMMARY
          if [ -d "app/src/main/assets/qemu_binaries" ]; then
            echo "✅ QEMU binaries directory exists" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            ls -lh app/src/main/assets/qemu_binaries/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No binaries found" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ QEMU binaries directory not found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK Information" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/release/*.apk >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "APK not found" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-vm-release-apk-with-qemu
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload QEMU Binaries Info
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-bundle-info
          path: |
            app/src/main/assets/qemu_binaries/BUNDLE_INFO.txt
            qemu-downloads/*.xz
          retention-days: 7
          if-no-files-found: ignore
