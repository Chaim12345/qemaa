name: Android Emulator Test

# Runs the real release APK (the one bundled with the cross-compiled QEMU
# binaries produced by "Android CI & QEMU Build") on a hardware-accelerated
# Android 16 (API 36) x86_64 emulator. This is the FULL test:
#   1. the APK must bundle QEMU for BOTH host ABIs (x86_64 + arm64-v8a),
#   2. the bundled QEMU binary must execute standalone on the emulator,
#   3. the APK must install and launch without crashing,
#   4. tapping "Start" must actually spawn the QEMU process,
#   5. the Alpine guest must FULLY BOOT to its login prompt over QEMU's
#      user-mode network (an initramfs emergency shell is a FAILURE),
#   6. tapping "Stop" must terminate the QEMU process.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Android CI & QEMU Build"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  ANDROID_API_LEVEL: "36"
  ANDROID_TARGET: google_apis
  ANDROID_ARCH: x86_64
  APP_PACKAGE: com.aistudio.linuxvm.qemu
  APP_ACTIVITY: com.example.MainActivity
  BUILD_WORKFLOW_NAME: "Android CI & QEMU Build"
  APK_ARTIFACT_NAME: linux-vm-release-apk

jobs:
  emulator-test:
    name: Install, boot and stop the VM on an Android emulator
    # Auto-run only after a successful build; manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release APK from the build workflow
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="${TRIGGERING_RUN_ID}"
          if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
            echo "Manual dispatch: locating the latest successful '${BUILD_WORKFLOW_NAME}' run..."
            run_id="$(gh run list \
              --workflow "${BUILD_WORKFLOW_NAME}" \
              --branch "${HEAD_BRANCH}" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
            echo "::error::Could not find a successful '${BUILD_WORKFLOW_NAME}' run; no APK to test."
            exit 1
          fi
          echo "Downloading APK artifact '${APK_ARTIFACT_NAME}' from run ${run_id}"
          mkdir -p apk
          gh run download "${run_id}" --name "${APK_ARTIFACT_NAME}" --dir apk
          ls -lh apk

      - name: Enable KVM for the emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache emulator system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-36
          key: sysimg-36-google_apis-x86_64-v1

      - name: Cache AVD
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-google_apis-x86_64-v1

      - name: Run app on emulator (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          avd-name: qemu-api36
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -memory 3072
          disable-animations: true
          script: bash ${GITHUB_WORKSPACE}/.github/scripts/emulator-test.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-evidence
          path: emulator-artifacts/
          if-no-files-found: warn
          retention-days: 7
