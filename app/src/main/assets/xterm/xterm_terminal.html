<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Linux VM xterm.js Terminal Emulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #06090F;
      color: #E2E8F0;
      font-family: "JetBrains Mono", "Fira Code", "Source Code Pro", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.35;
      overflow: hidden;
      user-select: text;
      -webkit-user-select: text;
    }
    #terminal-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #06090F;
      position: relative;
    }
    #terminal-screen {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 10px 14px 10px;
      word-break: break-all;
      white-space: pre-wrap;
      scrollbar-width: thin;
      scrollbar-color: #1E293B #06090F;
      -webkit-overflow-scrolling: touch;
      cursor: text;
    }
    #terminal-screen::-webkit-scrollbar {
      width: 4px;
    }
    #terminal-screen::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 2px;
    }
    .xterm-line {
      display: block;
      min-height: 17px;
      padding: 0.5px 0;
    }
    .xterm-cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background-color: #00F5D4;
      vertical-align: middle;
      animation: xterm-blink 1s step-start infinite;
      margin-left: 1px;
      border-radius: 1px;
    }
    @keyframes xterm-blink {
      50% { opacity: 0; }
    }
    /* ANSI & Theme Colors */
    .c-black   { color: #4A5568; }
    .c-red     { color: #FF5555; }
    .c-green   { color: #50FA7B; }
    .c-yellow  { color: #F1FA8C; }
    .c-blue    { color: #6272A4; }
    .c-magenta { color: #BD93F9; }
    .c-cyan    { color: #8BE9FD; }
    .c-white   { color: #F8F8F2; }
    
    .c-bright-black   { color: #6272A4; }
    .c-bright-red     { color: #FF6E6E; }
    .c-bright-green   { color: #69FF94; }
    .c-bright-yellow  { color: #FFFFA5; }
    .c-bright-blue    { color: #D6ACFF; }
    .c-bright-magenta { color: #FF92DF; }
    .c-bright-cyan    { color: #A4FFFF; }
    .c-bright-white   { color: #FFFFFF; }

    .c-bold      { font-weight: bold; }
    .c-dim       { opacity: 0.65; }
    .c-italic    { font-style: italic; }
    .c-underline { text-decoration: underline; }

    /* Theme definitions */
    body.theme-cyber {
      background-color: #06090F;
      color: #E2E8F0;
    }
    body.theme-monokai {
      background-color: #272822;
      color: #F8F8F2;
    }
    body.theme-matrix {
      background-color: #000B00;
      color: #00FF66;
    }
    body.theme-dracula {
      background-color: #282A36;
      color: #F8F8F2;
    }
    body.theme-amber {
      background-color: #120A00;
      color: #FFB000;
    }
    body.theme-solarized {
      background-color: #002B36;
      color: #93A1A1;
    }

    #active-line-wrapper {
      display: inline;
    }
    #active-prompt {
      user-select: none;
      -webkit-user-select: none;
    }
    #hidden-input {
      position: absolute;
      left: -9999px;
      top: -9999px;
      opacity: 0;
      pointer-events: none;
      font-size: 16px; /* Prevents auto-zoom on iOS/Android */
    }
    /* Touch Feedback Ripple Effect on Tap */
    .touch-indicator {
      position: absolute;
      border-radius: 50%;
      background: rgba(0, 245, 212, 0.25);
      transform: scale(0);
      animation: ripple 0.4s linear;
      pointer-events: none;
    }
    @keyframes ripple {
      to {
        transform: scale(3.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body class="theme-cyber">
  <div id="terminal-container">
    <div id="terminal-screen" tabindex="0">
      <div id="terminal-output"></div>
      <div id="active-line-wrapper">
        <span id="active-prompt" class="c-bright-green c-bold"></span><span id="active-input" class="c-bright-white"></span><span class="xterm-cursor" id="cursor"></span>
      </div>
    </div>
  </div>
  <input type="text" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

  <script>
    (function() {
      const outputDiv = document.getElementById('terminal-output');
      const activePromptSpan = document.getElementById('active-prompt');
      const activeInputSpan = document.getElementById('active-input');
      const screenDiv = document.getElementById('terminal-screen');
      const hiddenInput = document.getElementById('hidden-input');
      const cursor = document.getElementById('cursor');

      let currentPrompt = "root@alpine:~# ";
      let currentInputBuffer = "";
      let cursorPosition = 0;
      let history = [];
      let historyIndex = -1;
      let maxLines = 1500;

      // Pinch zoom gesture variables
      let currentScale = 13;
      let startDistance = 0;

      // Initialize
      activePromptSpan.textContent = currentPrompt;

      // Focus management for mobile touch keyboard
      function focusInput() {
        hiddenInput.focus();
        hiddenInput.setSelectionRange(currentInputBuffer.length, currentInputBuffer.length);
      }

      screenDiv.addEventListener('click', function(e) {
        focusInput();
      });

      // Touch gesture support: Pinch-to-zoom font scaling
      screenDiv.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          startDistance = Math.hypot(dx, dy);
        }
      }, { passive: true });

      screenDiv.addEventListener('touchmove', function(e) {
        if (e.touches.length === 2 && startDistance > 0) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          const delta = dist - startDistance;
          if (Math.abs(delta) > 25) {
            if (delta > 0 && currentScale < 22) {
              currentScale += 1;
              window.xtermSetFontSize(currentScale);
              startDistance = dist;
            } else if (delta < 0 && currentScale > 10) {
              currentScale -= 1;
              window.xtermSetFontSize(currentScale);
              startDistance = dist;
            }
          }
        }
      }, { passive: true });

      screenDiv.addEventListener('touchend', function(e) {
        if (e.touches.length < 2) {
          startDistance = 0;
        }
      }, { passive: true });

      // Swipe gestures for command history (Swipe Up / Swipe Down)
      let touchStartY = 0;
      let touchStartX = 0;
      screenDiv.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
          touchStartY = e.touches[0].clientY;
          touchStartX = e.touches[0].clientX;
        }
      }, { passive: true });

      hiddenInput.addEventListener('input', function(e) {
        currentInputBuffer = hiddenInput.value;
        cursorPosition = currentInputBuffer.length;
        renderActiveInput();
        if (window.AndroidTerminal && window.AndroidTerminal.onBufferChange) {
          window.AndroidTerminal.onBufferChange(currentInputBuffer);
        }
      });

      hiddenInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const cmd = currentInputBuffer;
          currentInputBuffer = "";
          hiddenInput.value = "";
          historyIndex = -1;
          if (cmd.trim().length > 0) {
            history.push(cmd);
          }
          renderActiveInput();
          
          if (window.AndroidTerminal && window.AndroidTerminal.onCommand) {
            window.AndroidTerminal.onCommand(cmd);
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          navigateHistoryPrev();
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          navigateHistoryNext();
        } else if (e.key === 'Tab') {
          e.preventDefault();
          if (window.AndroidTerminal && window.AndroidTerminal.onTab) {
            window.AndroidTerminal.onTab(currentInputBuffer);
          }
        } else if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) {
          e.preventDefault();
          if (window.AndroidTerminal && window.AndroidTerminal.onCtrlC) {
            window.AndroidTerminal.onCtrlC();
          }
        } else if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) {
          e.preventDefault();
          window.xtermClear();
        }
      });

      function navigateHistoryPrev() {
        if (history.length > 0) {
          if (historyIndex === -1) historyIndex = history.length - 1;
          else if (historyIndex > 0) historyIndex--;
          currentInputBuffer = history[historyIndex];
          hiddenInput.value = currentInputBuffer;
          renderActiveInput();
        }
      }

      function navigateHistoryNext() {
        if (historyIndex !== -1) {
          if (historyIndex < history.length - 1) {
            historyIndex++;
            currentInputBuffer = history[historyIndex];
          } else {
            historyIndex = -1;
            currentInputBuffer = "";
          }
          hiddenInput.value = currentInputBuffer;
          renderActiveInput();
        }
      }

      function renderActiveInput() {
        activeInputSpan.textContent = currentInputBuffer;
        scrollToBottom();
      }

      function scrollToBottom() {
        screenDiv.scrollTop = screenDiv.scrollHeight;
      }

      // ANSI to HTML Parser
      function parseAnsi(text) {
        if (!text) return "";
        let clean = text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

        // ANSI Color Replacements
        clean = clean
          .replace(/\x1b\[0?m/g, '</span>')
          .replace(/\x1b\[1m/g, '<span class="c-bold">')
          .replace(/\x1b\[2m/g, '<span class="c-dim">')
          .replace(/\x1b\[3m/g, '<span class="c-italic">')
          .replace(/\x1b\[4m/g, '<span class="c-underline">')
          .replace(/\x1b\[30m/g, '<span class="c-black">')
          .replace(/\x1b\[31m/g, '<span class="c-red">')
          .replace(/\x1b\[32m/g, '<span class="c-green">')
          .replace(/\x1b\[33m/g, '<span class="c-yellow">')
          .replace(/\x1b\[34m/g, '<span class="c-blue">')
          .replace(/\x1b\[35m/g, '<span class="c-magenta">')
          .replace(/\x1b\[36m/g, '<span class="c-cyan">')
          .replace(/\x1b\[37m/g, '<span class="c-white">')
          .replace(/\x1b\[90m/g, '<span class="c-bright-black">')
          .replace(/\x1b\[91m/g, '<span class="c-bright-red">')
          .replace(/\x1b\[92m/g, '<span class="c-bright-green">')
          .replace(/\x1b\[93m/g, '<span class="c-bright-yellow">')
          .replace(/\x1b\[94m/g, '<span class="c-bright-blue">')
          .replace(/\x1b\[95m/g, '<span class="c-bright-magenta">')
          .replace(/\x1b\[96m/g, '<span class="c-bright-cyan">')
          .replace(/\x1b\[97m/g, '<span class="c-bright-white">');

        return clean;
      }

      // Public Terminal API methods callable from Android
      window.xtermWrite = function(data) {
        if (!data) return;
        const formatted = parseAnsi(data);
        const span = document.createElement('span');
        span.innerHTML = formatted;
        outputDiv.appendChild(span);
        pruneLines();
        scrollToBottom();
      };

      window.xtermWriteln = function(line) {
        const div = document.createElement('div');
        div.className = 'xterm-line';
        div.innerHTML = parseAnsi(line || "");
        outputDiv.appendChild(div);
        pruneLines();
        scrollToBottom();
      };

      window.xtermClear = function() {
        outputDiv.innerHTML = "";
        scrollToBottom();
      };

      window.xtermSetPrompt = function(promptText) {
        currentPrompt = promptText;
        activePromptSpan.textContent = promptText;
        scrollToBottom();
      };

      window.xtermSetInput = function(text) {
        currentInputBuffer = text || "";
        hiddenInput.value = currentInputBuffer;
        renderActiveInput();
      };

      window.xtermInsert = function(str) {
        currentInputBuffer += str;
        hiddenInput.value = currentInputBuffer;
        renderActiveInput();
        focusInput();
      };

      window.xtermBackspace = function() {
        if (currentInputBuffer.length > 0) {
          currentInputBuffer = currentInputBuffer.slice(0, -1);
          hiddenInput.value = currentInputBuffer;
          renderActiveInput();
        }
      };

      window.xtermSetTheme = function(themeName) {
        document.body.className = "theme-" + (themeName || "cyber");
      };

      window.xtermSetFontSize = function(sizePx) {
        currentScale = sizePx;
        document.body.style.fontSize = sizePx + "px";
        scrollToBottom();
      };

      window.xtermFocus = function() {
        focusInput();
      };

      window.xtermSendKey = function(key) {
        if (key === 'ENTER') {
          const cmd = currentInputBuffer;
          currentInputBuffer = "";
          hiddenInput.value = "";
          historyIndex = -1;
          if (cmd.trim().length > 0) history.push(cmd);
          renderActiveInput();
          if (window.AndroidTerminal && window.AndroidTerminal.onCommand) {
            window.AndroidTerminal.onCommand(cmd);
          }
        } else if (key === 'TAB') {
          if (window.AndroidTerminal && window.AndroidTerminal.onTab) {
            window.AndroidTerminal.onTab(currentInputBuffer);
          }
        } else if (key === 'CTRL_C') {
          if (window.AndroidTerminal && window.AndroidTerminal.onCtrlC) {
            window.AndroidTerminal.onCtrlC();
          }
        } else if (key === 'CLEAR') {
          window.xtermClear();
        } else if (key === 'ARROW_UP') {
          navigateHistoryPrev();
        } else if (key === 'ARROW_DOWN') {
          navigateHistoryNext();
        } else if (key === 'BACKSPACE') {
          window.xtermBackspace();
        }
      };

      function pruneLines() {
        while (outputDiv.children.length > maxLines) {
          outputDiv.removeChild(outputDiv.firstChild);
        }
      }

      // Notify Android container that Xterm.js is initialized
      window.addEventListener('load', function() {
        const charWidth = 7.8;
        const charHeight = 17;
        const cols = Math.floor(window.innerWidth / charWidth);
        const rows = Math.floor(window.innerHeight / charHeight);

        if (window.AndroidTerminal && window.AndroidTerminal.onReady) {
          window.AndroidTerminal.onReady(cols, rows);
        }
      });

      window.addEventListener('resize', function() {
        const charWidth = 7.8;
        const charHeight = 17;
        const cols = Math.floor(window.innerWidth / charWidth);
        const rows = Math.floor(window.innerHeight / charHeight);
        if (window.AndroidTerminal && window.AndroidTerminal.onResize) {
          window.AndroidTerminal.onResize(cols, rows);
        }
        scrollToBottom();
      });

    })();
  </script>
</body>
</html>
