<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Linux VM Terminal</title>
  <link rel="stylesheet" href="xterm.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #06090F;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }
    #term {
      position: absolute;
      inset: 0;
      padding: 4px 2px 8px 6px;
    }
    /* Make the xterm viewport scroll with one finger */
    .xterm .xterm-viewport {
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
    .xterm .xterm-screen {
      touch-action: pan-y;
    }
  </style>
</head>
<body>
  <div id="term"></div>
  <script src="xterm.js"></script>
  <script>
    (function() {
      // ── Themes ────────────────────────────────────────────────────────────
      const THEMES = {
        cyber:    { background: '#06090F', foreground: '#E2E8F0', cursor: '#00F5D4', cursorAccent: '#06090F', selectionBackground: '#164E5A' },
        monokai:  { background: '#272822', foreground: '#F8F8F2', cursor: '#F8F8F0', cursorAccent: '#272822', selectionBackground: '#49483E' },
        matrix:   { background: '#000B00', foreground: '#00FF66', cursor: '#00FF66', cursorAccent: '#000B00', selectionBackground: '#0A3A1A',
                    black: '#003300', red: '#00AA44', green: '#00FF66', yellow: '#88FF88', blue: '#00CC88', magenta: '#66FFAA', cyan: '#44FFCC', white: '#CCFFDD' },
        dracula:  { background: '#282A36', foreground: '#F8F8F2', cursor: '#FF79C6', cursorAccent: '#282A36', selectionBackground: '#44475A',
                    black: '#21222C', red: '#FF5555', green: '#50FA7B', yellow: '#F1FA8C', blue: '#BD93F9', magenta: '#FF79C6', cyan: '#8BE9FD', white: '#F8F8F2' },
        amber:    { background: '#120A00', foreground: '#FFB000', cursor: '#FFB000', cursorAccent: '#120A00', selectionBackground: '#4A3200',
                    black: '#5A3A00', red: '#FF6600', green: '#FFCC33', yellow: '#FFD966', blue: '#CC8844', magenta: '#FF9944', cyan: '#FFAA55', white: '#FFD699' },
        solarized:{ background: '#002B36', foreground: '#93A1A1', cursor: '#93A1A1', cursorAccent: '#002B36', selectionBackground: '#274642' }
      };

      let term = null;
      let ctrlActive = false;
      let altActive = false;
      let pinchStartDistance = 0;
      // A persistent stream decoder survives UTF-8 sequences split across chunks.
      const streamDecoder = new TextDecoder('utf-8');

      function b64encodeUtf8(str) {
        const bytes = new TextEncoder().encode(str);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      }

      function b64decodeUtf8(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        // stream:true keeps partial multi-byte sequences pending until the next chunk
        return streamDecoder.decode(bytes, { stream: true });
      }

      function notifyModifiers() {
        if (window.AndroidTerminal && window.AndroidTerminal.onModifiersChanged) {
          window.AndroidTerminal.onModifiersChanged(ctrlActive, altActive);
        }
      }

      function createTerm(fontPx, themeId) {
        term = new window.Terminal({
          fontSize: fontPx || 16,
          fontFamily: '"JetBrains Mono", "Fira Code", "Droid Sans Mono", "Courier New", monospace',
          cursorBlink: true,
          scrollback: 5000,
          drawBoldTextInBrightColors: true,
          allowProposedApi: true,
          theme: THEMES[themeId] || THEMES.cyber
        });
        term.open(document.getElementById('term'));

        term.onData(function(data) {
          if (window.AndroidTerminal && window.AndroidTerminal.onData) {
            window.AndroidTerminal.onData(b64encodeUtf8(data));
          }
        });

        term.onResize(function(size) {
          if (window.AndroidTerminal && window.AndroidTerminal.onResize) {
            window.AndroidTerminal.onResize(size.cols, size.rows);
          }
        });

        // Soft-keyboard modifier interception: when CTRL/ALT is armed from the
        // extra keys row, transform the next printable keypress here instead of
        // letting xterm emit the plain character.
        const ta = term.textarea;
        if (ta) {
          ta.addEventListener('keydown', function(e) {
            if ((ctrlActive || altActive) && e.key && e.key.length === 1) {
              e.preventDefault();
              e.stopPropagation();
              let payload = e.key;
              if (ctrlActive) {
                payload = String.fromCharCode(e.key.toUpperCase().charCodeAt(0) & 0x1F);
              }
              if (altActive) {
                payload = '\x1b' + payload;
              }
              ctrlActive = false;
              altActive = false;
              notifyModifiers();
              if (window.AndroidTerminal && window.AndroidTerminal.onData) {
                window.AndroidTerminal.onData(b64encodeUtf8(payload));
              }
            }
          }, true);
        }

        // Tapping the terminal focuses it and opens the soft keyboard.
        document.getElementById('term').addEventListener('click', function() {
          term.focus();
        });

        // Pinch-to-zoom font size (two-finger), tap-through otherwise.
        const termDiv = document.getElementById('term');
        termDiv.addEventListener('touchstart', function(e) {
          if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            pinchStartDistance = Math.hypot(dx, dy);
          }
        }, { passive: true });
        termDiv.addEventListener('touchmove', function(e) {
          if (e.touches.length === 2 && pinchStartDistance > 0) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            const delta = dist - pinchStartDistance;
            if (Math.abs(delta) > 30) {
              const current = term.options.fontSize || 16;
              const next = Math.max(8, Math.min(28, current + (delta > 0 ? 1 : -1)));
              if (next !== current) {
                term.options.fontSize = next;
                if (window.AndroidTerminal && window.AndroidTerminal.onFontSizeChanged) {
                  window.AndroidTerminal.onFontSizeChanged(next);
                }
              }
              pinchStartDistance = dist;
            }
          }
        }, { passive: true });
        termDiv.addEventListener('touchend', function(e) {
          if (e.touches.length < 2) pinchStartDistance = 0;
        }, { passive: true });

        term.focus();
        if (window.AndroidTerminal && window.AndroidTerminal.onReady) {
          window.AndroidTerminal.onReady(term.cols, term.rows);
        }
      }

      window.addEventListener('load', function() {
        createTerm(16, 'cyber');
      });

      // ── API used from Kotlin ──────────────────────────────────────────────
      window.termWrite = function(b64) {
        if (term && b64) term.write(b64decodeUtf8(b64));
      };

      window.termSetFontSize = function(px) {
        if (term) term.options.fontSize = Math.max(8, Math.min(28, px | 0));
      };

      window.termSetTheme = function(id) {
        if (term && THEMES[id]) term.options.theme = THEMES[id];
      };

      window.termClear = function() {
        if (term) term.clear();
      };

      window.termReset = function() {
        if (term) term.reset();
      };

      window.termFocus = function() {
        if (term) term.focus();
      };

      window.termGetSelection = function() {
        return term ? term.getSelection() : '';
      };

      window.termHasSelection = function() {
        return term ? term.hasSelection() : false;
      };

      window.termPaste = function(b64) {
        if (term) term.paste(b64decodeUtf8(b64));
      };

      window.termSetModifiers = function(ctrl, alt) {
        ctrlActive = !!ctrl;
        altActive = !!alt;
        notifyModifiers();
      };

      // Raw sequences for the extra keys row. These are injected as INPUT
      // (routed through AndroidTerminal.onData) so the guest and scrollback
      // behave exactly as if a hardware keyboard had produced them.
      const KEYSEQ = {
        ENTER:  '\r',
        TAB:    '\t',
        ESC:    '\x1b',
        BKSP:   '\x7f',
        CTRL_C: '\x03',
        CTRL_D: '\x04',
        CTRL_L: '\x0c',
        CTRL_Z: '\x1a',
        UP:     '\x1b[A',
        DOWN:   '\x1b[B',
        RIGHT:  '\x1b[C',
        LEFT:   '\x1b[D',
        HOME:   '\x1b[H',
        END:    '\x1b[F',
        PGUP:   '\x1b[5~',
        PGDN:   '\x1b[6~',
        DEL:    '\x1b[3~',
        INS:    '\x1b[2~',
        F1:     '\x1bOP',
        F2:     '\x1bOQ',
        F3:     '\x1bOR',
        F4:     '\x1bOS'
      };

      window.termSendKey = function(name) {
        const seq = KEYSEQ[name];
        if (seq && window.AndroidTerminal && window.AndroidTerminal.onData) {
          window.AndroidTerminal.onData(b64encodeUtf8(seq));
        }
      };

      // Literal text (already base64 of UTF-8 bytes) typed from the extra keys row.
      window.termSendLiteral = function(b64) {
        if (window.AndroidTerminal && window.AndroidTerminal.onData) {
          window.AndroidTerminal.onData(b64);
        }
      };
    })();
  </script>
</body>
</html>
